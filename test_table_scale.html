<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { margin: 0; padding: 0; background: #111; color: white; display: flex; flex-direction: column; height: 100vh; }
  main { flex: 1; position: relative; overflow: hidden; }
  #table-perspective {
    perspective: 1000px;
    perspective-origin: 50% 10%; /* lowered origin to make it look longer? */
  }
  #table-surface {
    /* w-[300px] h-[1200px] */
    transform: rotateX(60deg) translateY(-10%) translateZ(-50px);
    transform-origin: center bottom;
    transform-style: preserve-3d;
    background: linear-gradient(180deg, #111, #333);
    border: 2px solid #0ff;
  }
</style>
</head>
<body>
  <div style="height:50px; background: #222;">HUD</div>
  <main>
    <div id="table-perspective" class="absolute inset-0 flex items-end justify-center overflow-hidden pb-[10vh]">
      <div id="table-surface" class="w-[300px] h-[1200px] max-w-[85vw]">
         <!-- rails etc -->
      </div>
    </div>
  </main>
  <div style="height:100px; background: #222;">MENUS</div>
</body>
</html>
