<!DOCTYPE html>
<html>
<head>
<style>
  body { margin:0; overflow:hidden; background:#000; height: 100vh; display: flex; align-items: flex-end; justify-content: center; }
  
  #table-perspective {
    position: absolute;
    inset: 0;
    perspective: 800px;
    -webkit-perspective: 800px;
    perspective-origin: 50% 30%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    padding-bottom: 2vh;
  }
  
  #table-wrapper {
    position: relative;
    width: 92vw;
    max-width: 440px;
    aspect-ratio: 1 / 3.8;
    transform: rotateX(55deg) translateZ(0);
    transform-origin: center bottom;
    transform-style: preserve-3d;
  }

  #table-surface {
    position: absolute;
    inset: 0;
    background: #111;
    border-radius: 4px;
    transform-style: preserve-3d;
    box-shadow: 
      inset 0 0 100px rgba(0,0,0,0.9),
      0 0 30px rgba(0,243,255,0.1);
    border: 1px solid rgba(0,243,255,0.3);
  }

  /* Physical Side Rails */
  .rail {
    position: absolute;
    background: #080808;
    border: 1px solid rgba(0,243,255,0.4);
    box-shadow: inset 0 0 10px rgba(0,243,255,0.1);
  }
  .rail-left {
    left: -10px; top: -10px; bottom: -10px; width: 10px;
    transform-origin: right center;
    transform: rotateY(-90deg);
  }
  .rail-right {
    right: -10px; top: -10px; bottom: -10px; width: 10px;
    transform-origin: left center;
    transform: rotateY(90deg);
  }
  .rail-top {
    top: -10px; left: 0; right: 0; height: 10px;
    transform-origin: bottom center;
    transform: rotateX(90deg);
  }
  .rail-bottom {
    bottom: -10px; left: 0; right: 0; height: 10px;
    transform-origin: top center;
    transform: rotateX(-90deg);
  }

  .cup-formation { width:100%; display:flex; flex-direction:column; align-items:center; }
  .cup-formation-ai { position:absolute; top: 4%; left:0; right:0; }
  .cup-formation-player { position:absolute; bottom: 4%; left:0; right:0; }
  .cup-row { display:flex; justify-content:center; gap:13px; margin-bottom:-10px; }
  .cup { width:50px; height:50px; border-radius:50%; background:#f00; border:3px solid #fff; }
</style>
</head>
<body>
<div id="table-perspective">
  <div id="table-wrapper">
    <div id="table-surface">
      <div class="rail rail-left"></div>
      <div class="rail rail-right"></div>
      <div class="rail rail-top"></div>
      <div class="rail rail-bottom"></div>

      <div class="cup-formation cup-formation-ai">
        <div class="cup-row">
          <div class="cup"></div><div class="cup"></div><div class="cup"></div><div class="cup"></div>
        </div>
      </div>
      <div class="cup-formation cup-formation-player">
        <div class="cup-row">
          <div class="cup"></div><div class="cup"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
